name: Deploy to Netlify

on:
  push:
    branches: [claude/awesome-darwin-x03qh7]
    paths: ['buhgalteriya/**', 'netlify.toml', '.github/workflows/netlify.yml']
  workflow_dispatch:

concurrency:
  group: netlify
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
    steps:
      - name: Check secrets
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ] || [ -z "$NETLIFY_SITE_ID" ]; then
            echo "::error::Add NETLIFY_AUTH_TOKEN and NETLIFY_SITE_ID in Settings → Secrets and variables → Actions"
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy
        run: npx --yes netlify-cli@17 deploy --dir=buhgalteriya --prod --message "${{ github.sha }}"
